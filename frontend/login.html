<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight DSS - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="fas fa-chart-line"></i> BizInsight DSS</h2>
            <p>Sign in to your account</p>
        </div>
        <div class="auth-body">
            <div id="alert-box"></div>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Register here</a>
            </div>
        </div>
    </div>
</div>
<script>
    // Show messages from URL params
    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alert-box');
    if (params.get('error')) {
        alertBox.innerHTML = `<div class="alert alert-error">${params.get('error')}</div>`;
    }
    if (params.get('success')) {
        alertBox.innerHTML = `<div class="alert alert-success">${params.get('success')}</div>`;
    }
</script>
</body>
</html>
