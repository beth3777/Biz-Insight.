<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight DSS - Page Not Found</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            text-align: center;
            color: white;
            padding: 40px;
        }

        .error-content { max-width: 480px; }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #e94560;
            line-height: 1;
            margin-bottom: 8px;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .error-content h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .error-content p {
            color: #a8a8b3;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .error-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-back {
            padding: 12px 28px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn-back:hover { background-color: #c73652; }

        .btn-home {
            padding: 12px 28px;
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-home:hover {
            border-color: white;
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
<div class="error-wrapper">
    <div class="error-content">
        <div class="error-icon"><i class="fas fa-chart-line"></i></div>
        <div class="error-code">404</div>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved. 
        Let's get you back on track.</p>
        <div class="error-buttons">
            <a href="javascript:history.back()" class="btn-back">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
            <a href="/" class="btn-home">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </div>
</div>
</body>
</html>
