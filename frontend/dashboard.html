<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight DSS - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a class="navbar-brand" href="/dashboard.html">
        <i class="fas fa-chart-line"></i> BizInsight DSS
    </a>
    <div class="navbar-user">
        <div class="notif-bell" onclick="toggleNotifications()" style="position:relative; cursor:pointer;">
            <i class="fas fa-bell" style="font-size:1.1rem; color:white;"></i>
            <span id="notif-count" style="
                position:absolute; top:-6px; right:-6px;
                background:#e94560; color:white;
                border-radius:50%; width:16px; height:16px;
                font-size:0.65rem; display:none;
                align-items:center; justify-content:center;
                font-weight:700;
            "></span>
        </div>

        <span><i class="fas fa-user-circle"></i> <span id="username">...</span></span>
        <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</nav>

<!-- Notification Panel -->
<div id="notif-panel" style="
    display:none; position:fixed; top:60px; right:16px;
    width:340px; background:white; border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.15); z-index:9998;
    overflow:hidden;
">
    <div style="background:#1a1a2e; color:white; padding:14px 18px; font-weight:600; font-size:0.95rem;">
        <i class="fas fa-bell"></i> Notifications
    </div>
    <div id="notif-list" style="max-height:360px; overflow-y:auto; padding:8px;"></div>
    
</div>


<!-- Sidebar -->
<div class="sidebar">
    <nav>
        <a href="/dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/upload.html"><i class="fas fa-upload"></i> Upload Data</a>
        <a href="/forecast.html"><i class="fas fa-chart-bar"></i> Sales Forecast</a>
        <a href="/reports.html"><i class="fas fa-file-alt"></i> Reports</a>
        <a href="/inventory.html" class="{% if active == 'inventory' %}active{% endif %}"><i class="fas fa-boxes"></i> Inventory</a>
        <a href="/manage-staff.html"><i class="fas fa-users"></i> Manage Staff</a>
        <a href="/audit-log.html"><i class="fas fa-history"></i> Audit Log</a>
        <a href="/data-entry.html"><i class="fas fa-plus-circle"></i> Add Transaction</a>
        <a href="/settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
</div>

<!-- Main Content -->
<div class="main-content">
    
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
    <div>
        <h1>Dashboard</h1>
        <p id="business-name">Loading...</p>
        

    </div>
        <button onclick="window.print()" style="
            padding:10px 20px; background:#1a1a2e; color:white;
            border:none; border-radius:8px; cursor:pointer;
            font-size:0.9rem; font-weight:600; display:flex;
            align-items:center; gap:8px;">
            <i class="fas fa-print"></i> Print Dashboard
        </button>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
        <div class="kpi-card revenue">
            <div class="kpi-info">
                <div class="kpi-label">Total Revenue</div>
                <div class="kpi-value" id="kpi-revenue">...</div>
            </div>
            <div class="kpi-icon"><i class="fas fa-money-bill-wave"></i></div>
        </div>
        <div class="kpi-card profit">
            <div class="kpi-info">
                <div class="kpi-label">Total Profit</div>
                <div class="kpi-value" id="kpi-profit">...</div>
            </div>
            <div class="kpi-icon"><i class="fas fa-chart-line"></i></div>
        </div>
        <div class="kpi-card expenses">
            <div class="kpi-info">
                <div class="kpi-label">Total Expenses</div>
                <div class="kpi-value" id="kpi-expenses">...</div>
            </div>
            <div class="kpi-icon"><i class="fas fa-receipt"></i></div>
        </div>
        <div class="kpi-card products">
            <div class="kpi-info">
                <div class="kpi-label">Total Products</div>
                <div class="kpi-value" id="kpi-products">...</div>
            </div>
            <div class="kpi-icon"><i class="fas fa-box"></i></div>
        </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
        <div class="card">
             <div class="card-header">
                <span><i class="fas fa-chart-area"></i> Sales Trend</span>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button onclick="loadSalesTrend(7)"
                        style="padding:4px 10px; border:1px solid rgba(255,255,255,0.3);
                       background:transparent; color:white; border-radius:6px;
                       cursor:pointer; font-size:0.8rem;" id="btn-7">7D</button>
                    <button onclick="loadSalesTrend(30)"
                        style="padding:4px 10px; border:1px solid rgba(255,255,255,0.3);
                       background:#e94560; color:white; border-radius:6px;
                       cursor:pointer; font-size:0.8rem;" id="btn-30">30D</button>
                    <button onclick="loadSalesTrend(90)"
                        style="padding:4px 10px; border:1px solid rgba(255,255,255,0.3);
                       background:transparent; color:white; border-radius:6px;
                       cursor:pointer; font-size:0.8rem;" id="btn-90">90D</button>
                </div>
            </div>
    <div class="card-body">
        <canvas id="salesTrendChart" height="100"></canvas>
    </div>
</div>
        <div class="card">
            <div class="card-header"><i class="fas fa-trophy"></i> Top Products</div>
            <div class="card-body">
                <canvas id="topProductsChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>
