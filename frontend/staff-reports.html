<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight DSS - Sales Summary</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/staff-dashboard.html">
        <i class="fas fa-chart-line"></i> BizInsight DSS
    </a>
    <div class="navbar-user">
        <span style="background:rgba(233,69,96,0.2); color:#e94560;
                     padding:3px 10px; border-radius:20px; font-size:0.78rem; font-weight:600;">
            <i class="fas fa-user-tie"></i> Staff
        </span>
        <span><i class="fas fa-user-circle"></i> <span id="username">...</span></span>
        <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</nav>

<div class="sidebar">
    <nav>
        <a href="/staff-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/staff-inventory.html"><i class="fas fa-boxes"></i> Inventory</a>
        <a href="/staff-reports.html" class="active"><i class="fas fa-file-alt"></i> Sales Summary</a>
    </nav>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Sales Summary</h1>
        <p>View daily sales transactions</p>
    </div>

    <div class="card">
        <div class="card-header"><i class="fas fa-filter"></i> Filter by Date</div>
        <div class="card-body">
            <div class="report-filters">
                <div class="filter-group">
                    <label>Start Date</label>
                    <input type="date" id="start-date">
                </div>
                <div class="filter-group">
                    <label>End Date</label>
                    <input type="date" id="end-date">
                </div>
                <button class="btn-filter" onclick="loadReport()">
                    <i class="fas fa-search"></i> Filter
                </button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span><i class="fas fa-table"></i> Sales Transactions</span>
            <span id="record-count" style="font-size:0.85rem; opacity:0.8;"></span>
        </div>
        <div class="card-body" style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Amount (KES)</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="report-table-body">
                    <tr><td colspan="5" style="text-align:center; color:#aaa; padding:30px;">
                        Select a date range and click Filter
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="/js/staff-reports.js"></script>
</body>
</html>
