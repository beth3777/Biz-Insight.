<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight DSS - Settings</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/dashboard.html">
        <i class="fas fa-chart-line"></i> BizInsight DSS
    </a>
    <div class="navbar-user">
        <div class="notif-bell" onclick="toggleNotifications()"
             style="position:relative; cursor:pointer;">
            <i class="fas fa-bell" style="font-size:1.1rem; color:white;"></i>
            <span id="notif-count" style="
                position:absolute; top:-6px; right:-6px; background:#e94560;
                color:white; border-radius:50%; width:16px; height:16px;
                font-size:0.65rem; display:none; align-items:center;
                justify-content:center; font-weight:700;"></span>
        </div>
        <span><i class="fas fa-user-circle"></i>
              <span id="username">...</span></span>
        <a href="/logout" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</nav>

<div id="notif-panel" style="
    display:none; position:fixed; top:60px; right:16px; width:340px;
    background:white; border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.15); z-index:9998; overflow:hidden;">
    <div style="background:#1a1a2e; color:white; padding:14px 18px; font-weight:600;">
        <i class="fas fa-bell"></i> Notifications
    </div>
    <div id="notif-list" style="max-height:360px; overflow-y:auto; padding:8px;"></div>
</div>

<div class="sidebar">
    <nav>
        <a href="/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/upload.html"><i class="fas fa-upload"></i> Upload Data</a>
        <a href="/forecast.html" class="active"><i class="fas fa-chart-bar"></i> Sales Forecast</a>
        <a href="/reports.html"><i class="fas fa-file-alt"></i> Reports</a>
        <a href="/inventory.html" class="{% if active == 'inventory' %}active{% endif %}"><i class="fas fa-boxes"></i> Inventory</a>
        <a href="/manage-staff.html"><i class="fas fa-users"></i> Manage Staff</a>
        <a href="/audit-log.html"><i class="fas fa-history"></i> Audit Log</a>
        <a href="/data-entry.html"><i class="fas fa-plus-circle"></i> Add Transaction</a>
        <a href="/settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Settings</h1>
        <p>Update your business details and account password</p>
    </div>

    <!-- Business Settings -->
    <div class="card">
        <div class="card-header">
            <i class="fas fa-building"></i> Business Details
        </div>
        <div class="card-body">
            <div id="business-alert"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr;
                        gap:20px; margin-bottom:20px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Business Name</label>
                    <input type="text" id="business-name"
                        placeholder="Enter business name"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Industry</label>
                    <select id="business-industry"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                        <option value="">Select industry...</option>
                        <option value="Retail">Retail</option>
                        <option value="Food & Beverage">Food & Beverage</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Services">Services</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Currency</label>
                    <select id="business-currency"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                        <option value="KES">KES — Kenyan Shilling</option>
                        <option value="USD">USD — US Dollar</option>
                        <option value="UGX">UGX — Ugandan Shilling</option>
                        <option value="TZS">TZS — Tanzanian Shilling</option>
                        <option value="ETB">ETB — Ethiopian Birr</option>
                    </select>
                </div>
            </div>
            <button class="btn-generate" onclick="saveBusinessSettings()">
                <i class="fas fa-save"></i> Save Business Details
            </button>
        </div>
    </div>

    <!-- Password Settings -->
    <div class="card">
        <div class="card-header">
            <i class="fas fa-lock"></i> Change Password
        </div>
        <div class="card-body">
            <div id="password-alert"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr;
                        gap:20px; margin-bottom:20px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Current Password</label>
                    <input type="password" id="current-password"
                        placeholder="Enter current password"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>New Password</label>
                    <input type="password" id="new-password"
                        placeholder="Enter new password"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirm-password"
                        placeholder="Confirm new password"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                </div>
            </div>
            <button class="btn-generate" onclick="savePassword()">
                <i class="fas fa-key"></i> Update Password
            </button>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="/js/settings.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>
