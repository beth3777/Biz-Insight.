<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight DSS - Add Transaction</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/dashboard.html">
        <i class="fas fa-chart-line"></i> BizInsight DSS
    </a>
    <div class="navbar-user">
        <div class="notif-bell" onclick="toggleNotifications()"
             style="position:relative; cursor:pointer;">
            <i class="fas fa-bell" style="font-size:1.1rem; color:white;"></i>
            <span id="notif-count" style="
                position:absolute; top:-6px; right:-6px; background:#e94560;
                color:white; border-radius:50%; width:16px; height:16px;
                font-size:0.65rem; display:none; align-items:center;
                justify-content:center; font-weight:700;"></span>
        </div>
        <span><i class="fas fa-user-circle"></i>
              <span id="username">...</span></span>
        <a href="/logout" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</nav>

<div id="notif-panel" style="
    display:none; position:fixed; top:60px; right:16px; width:340px;
    background:white; border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.15); z-index:9998; overflow:hidden;">
    <div style="background:#1a1a2e; color:white; padding:14px 18px; font-weight:600;">
        <i class="fas fa-bell"></i> Notifications
    </div>
    <div id="notif-list" style="max-height:360px; overflow-y:auto; padding:8px;"></div>
</div>

<div class="sidebar">
    <nav>
        <a href="/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/upload.html"><i class="fas fa-upload"></i> Upload Data</a>
        <a href="/data-entry.html" class="active">
            <i class="fas fa-plus-circle"></i> Add Transaction
        </a>
        <a href="/forecast.html"><i class="fas fa-chart-bar"></i> Sales Forecast</a>
        <a href="/reports.html"><i class="fas fa-file-alt"></i> Reports</a>
        <a href="/inventory.html"><i class="fas fa-boxes"></i> Inventory</a>
        <a href="/manage-staff.html"><i class="fas fa-users"></i> Manage Staff</a>
        <a href="/audit-log.html"><i class="fas fa-history"></i> Audit Log</a>
        <a href="/settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Add Transaction</h1>
        <p>Manually record a single sale or expense</p>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">

        <!-- Entry Form -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-plus-circle"></i> New Transaction
            </div>
            <div class="card-body">
                <div id="entry-alert"></div>

                <!-- Type toggle -->
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <button id="btn-sale" onclick="setType('sale')"
                        style="flex:1; padding:10px; border:none; border-radius:8px;
                               font-weight:600; cursor:pointer; font-size:0.9rem;
                               background:#d4edda; color:#155724;">
                        <i class="fas fa-arrow-up"></i> Sale
                    </button>
                    <button id="btn-expense" onclick="setType('expense')"
                        style="flex:1; padding:10px; border:none; border-radius:8px;
                               font-weight:600; cursor:pointer; font-size:0.9rem;
                               background:#f0f0f0; color:#666;">
                        <i class="fas fa-arrow-down"></i> Expense
                    </button>
                </div>
                <input type="hidden" id="trans-type" value="sale">

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="trans-date"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                </div>

                <!-- Product selection -->
                <div class="form-group">
                    <label>Product</label>
                    <select id="product-select" onchange="onProductSelect()"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                        <option value="">-- Select existing product --</option>
                        <option value="new">+ Add new product</option>
                    </select>
                </div>

                <div id="new-product-fields" style="display:none;">
                    <div class="form-group">
                        <label>New Product Name</label>
                        <input type="text" id="new-product-name"
                            placeholder="e.g. Maize Flour 2kg"
                            style="width:100%; padding:10px 14px;
                                   border:1px solid #ddd; border-radius:8px;
                                   font-size:0.95rem; outline:none;">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="new-category"
                            style="width:100%; padding:10px 14px;
                                   border:1px solid #ddd; border-radius:8px;
                                   font-size:0.95rem; outline:none;">
                            <option value="Groceries">Groceries</option>
                            <option value="Dairy">Dairy</option>
                            <option value="Bakery">Bakery</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Household">Household</option>
                            <option value="Overhead">Overhead</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label>Amount (KES)</label>
                        <input type="number" id="trans-amount"
                            placeholder="0.00" min="0" step="0.01"
                            style="width:100%; padding:10px 14px;
                                   border:1px solid #ddd; border-radius:8px;
                                   font-size:0.95rem; outline:none;">
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="trans-quantity"
                            value="1" min="1"
                            style="width:100%; padding:10px 14px;
                                   border:1px solid #ddd; border-radius:8px;
                                   font-size:0.95rem; outline:none;">
                    </div>
                </div>

                <div class="form-group" id="cost-field">
                    <label>Cost Price (KES) <span style="color:#aaa;
                        font-size:0.82rem;">optional</span></label>
                    <input type="number" id="trans-cost"
                        placeholder="0.00" min="0" step="0.01"
                        style="width:100%; padding:10px 14px;
                               border:1px solid #ddd; border-radius:8px;
                               font-size:0.95rem; outline:none;">
                </div>

                <button class="btn-generate" style="width:100%;"
                        onclick="submitTransaction()">
                    <i class="fas fa-plus"></i> Add Transaction
                </button>
            </div>
        </div>

        <!-- Recent entries -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-clock"></i> Recently Added
            </div>
            <div class="card-body" style="padding:0;">
                <div id="recent-entries" style="max-height:500px; overflow-y:auto;">
                    <div style="padding:30px; text-align:center; color:#aaa;">
                        Transactions you add will appear here
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="/js/data-entry.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>
